<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — publi.nation × Web Summit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #F97316;
      --pink: #E11D48;
      --bg: #0D0D0D;
      --bg-card: #1A1A1A;
      --text: #FFFFFF;
      --text-muted: #888888;
      --border: #2A2A2A;
      --gradient: linear-gradient(135deg, #F97316, #E11D48);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    .logo {
      font-size: 1rem;
      font-weight: 800;
      text-transform: lowercase;
      margin-bottom: 2rem;
      color: var(--text-muted);
    }
    .logo span { color: var(--orange); }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--orange);
    }

    select option { background: #1A1A1A; }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

    .alert {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    .token-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    #screen-token, #screen-form { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">publi<span>.</span>nation × web summit <span style="color:#444">/ admin</span></div>

  <!-- TELA: TOKEN -->
  <div id="screen-token">
    <h1>Configurar acesso</h1>
    <p class="subtitle">Cole seu token do GitHub para começar a publicar.</p>
    <div class="card">
      <div class="field">
        <label>Token do GitHub</label>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="token-hint">O token fica salvo só neste navegador. Nunca é enviado para nenhum servidor.</p>
      </div>
      <button class="btn" onclick="saveToken()">Salvar e entrar</button>
    </div>
  </div>

  <!-- TELA: FORMULÁRIO -->
  <div id="screen-form">
    <h1>Novo post</h1>
    <p class="subtitle">Preencha e publique direto no site.</p>

    <div id="alert" class="alert"></div>

    <div class="card">
      <div class="field">
        <label>Título</label>
        <input type="text" id="titulo" placeholder="Ex: O futuro do marketing de influência">
      </div>
      <div class="field">
        <label>Tag</label>
        <select id="tag">
          <option value="Painel">Painel</option>
          <option value="Tendência">Tendência</option>
          <option value="Novidade">Novidade</option>
          <option value="Entrevista">Entrevista</option>
          <option value="Destaque">Destaque</option>
        </select>
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="data">
      </div>
      <div class="field">
        <label>Resumo</label>
        <textarea id="resumo" placeholder="Escreva aqui o conteúdo do post..."></textarea>
      </div>
      <button class="btn" id="publish-btn" onclick="publicar()">Publicar post</button>
      <button class="btn-secondary" onclick="trocarToken()">Trocar token</button>
    </div>
  </div>
</div>

<script>
const REPO = 'publination/websummit';
const FILE = 'posts.json';

function init() {
  const token = localStorage.getItem('ws_token');
  if (token) {
    showForm();
  } else {
    showTokenScreen();
  }
  // Pré-preenche a data de hoje
  document.getElementById('data').value = new Date().toISOString().split('T')[0];
}

function showTokenScreen() {
  document.getElementById('screen-token').style.display = 'block';
  document.getElementById('screen-form').style.display = 'none';
}

function showForm() {
  document.getElementById('screen-token').style.display = 'none';
  document.getElementById('screen-form').style.display = 'block';
}

function saveToken() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) { alert('Cole o token antes de continuar.'); return; }
  localStorage.setItem('ws_token', token);
  showForm();
}

function trocarToken() {
  localStorage.removeItem('ws_token');
  showTokenScreen();
}

function showAlert(type, msg) {
  const el = document.getElementById('alert');
  el.className = 'alert ' + type;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

async function publicar() {
  const titulo = document.getElementById('titulo').value.trim();
  const tag    = document.getElementById('tag').value;
  const data   = document.getElementById('data').value;
  const resumo = document.getElementById('resumo').value.trim();

  if (!titulo || !resumo || !data) {
    showAlert('error', 'Preencha todos os campos antes de publicar.');
    return;
  }

  const btn = document.getElementById('publish-btn');
  btn.disabled = true;
  btn.textContent = 'Publicando...';

  const token = localStorage.getItem('ws_token');
  const headers = {
    'Authorization': `token ${token}`,
    'Content-Type': 'application/json'
  };

  try {
    // Busca o arquivo atual
    const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, { headers });
    const getJson = await getRes.json();

    if (!getRes.ok) throw new Error(getJson.message || 'Erro ao buscar posts.json');

    const currentContent = atob(getJson.content.replace(/\n/g, ''));
    const posts = JSON.parse(currentContent);
    const newId = posts.length > 0 ? Math.max(...posts.map(p => p.id)) + 1 : 1;

    posts.unshift({ id: newId, titulo, data, tag, resumo });

    const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));

    // Salva o arquivo atualizado
    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
      method: 'PUT',
      headers,
      body: JSON.stringify({
        message: `post: ${titulo}`,
        content: newContent,
        sha: getJson.sha
      })
    });

    const putJson = await putRes.json();
    if (!putRes.ok) throw new Error(putJson.message || 'Erro ao publicar');

    showAlert('success', '✅ Post publicado! Aparece no site em ~1 minuto.');
    document.getElementById('titulo').value = '';
    document.getElementById('resumo').value = '';
    document.getElementById('data').value = new Date().toISOString().split('T')[0];

  } catch (err) {
    showAlert('error', '❌ Erro: ' + err.message + '. Verifique seu token.');
  }

  btn.disabled = false;
  btn.textContent = 'Publicar post';
}

init();
</script>
</body>
</html>
